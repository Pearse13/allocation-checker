<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SheetCheck</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23f59e0b'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --card: #141726;
    --border: #1d2035;
    --dash: #252840;
    --text: #e2e8f0;
    --muted: #64748b;
    --dim: #475569;
    --faint: #334155;
    --amber: #f59e0b;
    --amber-dk: #d97706;
    --red: #ef4444;
    --green: #22c55e;
    --gutter: 3.5rem;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 var(--gutter) 5rem; }

  /* ── Hero ─────────────────────────────────────── */
  .hero {
    margin: 0 calc(-1 * var(--gutter));
    background:
      linear-gradient(160deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.78) 100%),
      url("hero.jpg") center 38% / cover no-repeat;
    padding: 110px var(--gutter) 68px;
    min-height: 420px;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .pill {
    display: inline-flex; width: fit-content;
    background: rgba(245,158,11,0.12);
    border: 1px solid rgba(245,158,11,0.28);
    color: var(--amber);
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    padding: 5px 13px; border-radius: 100px; margin-bottom: 22px;
  }
  .hero h1 {
    font-size: 3.75rem; font-weight: 800; color: #fff;
    letter-spacing: -0.04em; line-height: 1; margin: 0 0 16px;
  }
  .hero p { font-size: 1rem; color: rgba(255,255,255,0.5); max-width: 420px; line-height: 1.65; margin: 0; }

  .label {
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--amber); margin: 44px 0 14px;
  }

  /* ── Mode toggle ──────────────────────────────── */
  .modes { display: flex; gap: 20px; margin-bottom: 16px; font-size: 0.875rem; }
  .modes label { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #cbd5e1; }
  .modes input { accent-color: var(--amber); margin: 0; }

  /* ── Upload cards ─────────────────────────────── */
  .uploads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .uploads.single { grid-template-columns: 1fr; }
  .up {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px;
  }
  .up-title {
    font-size: 0.7rem; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.12em; margin: 2px 4px 10px;
  }
  .drop {
    position: relative;
    border: 1.5px dashed var(--dash); border-radius: 10px; min-height: 90px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    padding: 14px; text-align: center; cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .drop:hover, .drop.over { border-color: rgba(245,158,11,0.45); background: rgba(245,158,11,0.03); }
  .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .drop .hint { color: var(--dim); font-size: 0.78rem; }
  .drop .sub { color: var(--faint); font-size: 0.7rem; }
  .files { list-style: none; margin: 10px 0 0; padding: 0; }
  .files li {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 0.8rem; color: #cbd5e1; padding: 6px 4px;
  }
  .files li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files button {
    background: none; border: none; color: var(--dim); cursor: pointer; font-size: 1rem; line-height: 1; padding: 2px 6px;
  }
  .files button:hover { color: var(--red); }

  .run {
    margin-top: 22px;
    background: var(--amber); color: #0a0c14;
    font: 700 0.85rem 'Inter', sans-serif; letter-spacing: 0.03em;
    border: none; border-radius: 10px; padding: 0.75rem 2.25rem; cursor: pointer;
    transition: box-shadow 0.2s, background 0.2s;
  }
  .run:hover:not(:disabled) { background: var(--amber-dk); box-shadow: 0 8px 28px rgba(245,158,11,0.3); }
  .run:disabled { opacity: 0.4; cursor: not-allowed; }

  .status { margin-top: 18px; font-size: 0.875rem; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .status.err { color: #fca5a5; }
  .spin {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--amber);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  hr.rule { height: 1px; background: var(--border); border: none; margin: 44px calc(-1 * var(--gutter)) 0; }

  /* ── Summary ──────────────────────────────────── */
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 0 0 52px; }
  .metric { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px 26px 22px; }
  .metric-val { font-size: 2.75rem; font-weight: 800; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .metric-lbl { font-size: 0.62rem; color: var(--dim); margin-top: 10px; text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600; }
  .c-red { color: var(--red); } .c-amber { color: var(--amber); } .c-green { color: var(--green); } .c-white { color: var(--text); }

  .success {
    background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); color: #86efac;
    padding: 14px 18px; border-radius: 10px; font-size: 0.875rem; margin-bottom: 8px;
  }

  /* ── Gang sections ────────────────────────────── */
  .gang { display: flex; align-items: baseline; gap: 10px; margin: 48px 0 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .gang-name { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--amber); }
  .gang-file { font-size: 0.75rem; color: var(--faint); }

  details.day { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
  details.day > summary {
    list-style: none; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    font-size: 0.875rem; font-weight: 500; color: #cbd5e1; padding: 14px 18px; line-height: 1.4;
  }
  details.day > summary::-webkit-details-marker { display: none; }
  details.day > summary::before { content: "›"; color: var(--dim); font-size: 1.1rem; margin-right: 4px; transition: transform 0.15s; display: inline-block; }
  details.day[open] > summary::before { transform: rotate(90deg); }
  details.day > summary:hover { color: #f1f5f9; }
  details.day[open] > summary { border-bottom: 1px solid var(--border); }
  .sum-left { display: flex; align-items: center; flex: 1; min-width: 0; }
  .badge { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
  .badge .e { color: #fca5a5; } .badge .w { color: #fcd34d; } .badge .ok { color: var(--green); }
  .day-body { padding: 16px 18px; }
  .clear { color: var(--green); font-size: 0.875rem; margin: 0; }

  .issue { padding: 11px 16px; border-radius: 0 8px 8px 0; margin-bottom: 7px; font-size: 0.875rem; line-height: 1.55; }
  .issue.error { background: rgba(239,68,68,0.07); border-left: 3px solid var(--red); color: #fca5a5; }
  .issue.warning { background: rgba(245,158,11,0.07); border-left: 3px solid var(--amber); color: #fcd34d; }
  .issue-label { font-weight: 700; text-transform: uppercase; font-size: 0.6rem; letter-spacing: 0.14em; margin-bottom: 5px; opacity: 0.6; }

  details.parsed { margin-top: 12px; border: 1px solid var(--border); border-radius: 10px; }
  details.parsed > summary { cursor: pointer; font-size: 0.8rem; color: var(--muted); padding: 10px 14px; }
  .parsed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 4px 14px 14px; font-size: 0.82rem; color: #cbd5e1; }
  .parsed-grid h4 { margin: 6px 0 8px; font-size: 0.8rem; color: var(--text); }
  .parsed-grid ul { margin: 0; padding-left: 18px; line-height: 1.7; }

  /* ── Issue actions ────────────────────────────── */
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .btn {
    font: 600 0.75rem 'Inter', sans-serif; border-radius: 7px; padding: 6px 12px; cursor: pointer;
    background: transparent; color: var(--text); border: 1px solid #2f3452;
  }
  .btn:hover:not(:disabled) { border-color: var(--amber); color: var(--amber); }
  .btn.primary { background: var(--amber); color: #0a0c14; border-color: var(--amber); }
  .btn.primary:hover:not(:disabled) { background: var(--amber-dk); color: #0a0c14; }
  .btn:disabled { opacity: 0.5; cursor: wait; }
  .actions input[type=text] {
    font: 0.8rem 'Inter', sans-serif; color: var(--text); background: var(--bg);
    border: 1px solid #2f3452; border-radius: 7px; padding: 6px 10px; min-width: 0;
  }
  .actions input[type=text]:focus { outline: none; border-color: var(--amber); }
  .actions label.chk { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: #cbd5e1; }
  .actions label.chk input { accent-color: var(--amber); }
  .done-note { font-size: 0.78rem; color: #86efac; margin-top: 8px; }
  .done-note.muted { color: #94a3b8; }
  .act-err { font-size: 0.75rem; color: #fca5a5; width: 100%; }

  .unseen { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
  .unseen-note { font-size: 0.8rem; color: var(--muted); padding: 14px 18px 4px; margin: 0; line-height: 1.5; }
  .unseen-row { padding: 12px 18px; border-top: 1px solid var(--border); }
  .unseen-row:first-of-type { border-top: none; }
  .unseen-row .q { font-size: 0.875rem; color: #cbd5e1; }
  .unseen-row .q b { color: var(--text); }


  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 300;
    background: #1a2e22; border: 1px solid rgba(34,197,94,0.35); color: #86efac;
    font-size: 0.85rem; padding: 10px 16px; border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    max-width: calc(100vw - 32px);
  }

  /* ── Config menu ──────────────────────────────── */
  .menu-btn {
    position: fixed; top: 14px; left: 20px; z-index: 100;
    width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
    color: #94a3b8; font-size: 0.95rem; cursor: pointer;
  }
  .menu-btn:hover, .menu-btn[aria-expanded="true"] { border-color: var(--amber); color: var(--amber); background: #1a1d2e; }
  .menu {
    position: fixed; top: 58px; left: 20px; z-index: 100;
    width: 360px; max-width: calc(100vw - 40px); max-height: 80vh; overflow-y: auto;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.6); padding: 18px;
  }
  .menu-title { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--amber); margin: 0 0 14px; }
  .menu details { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 6px; }
  .menu summary { cursor: pointer; padding: 10px 14px; font-size: 0.84rem; color: #cbd5e1; }
  .menu summary .n { color: var(--dim); }
  .menu ul { margin: 0; padding: 0 14px 12px 32px; font-size: 0.8rem; color: #94a3b8; line-height: 1.7; }
  .menu b { color: var(--text); font-weight: 600; }
  .menu ul.roster { list-style: none; padding-left: 14px; }
  .roster-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .roster-row > span { min-width: 0; }
  .roster-edit { margin: 6px 0; width: 100%; }
  .roster-edit input { flex: 1 1 120px; font: 0.8rem 'Inter', sans-serif; color: var(--text); background: var(--bg); border: 1px solid #2f3452; border-radius: 7px; padding: 6px 10px; min-width: 0; }
  .roster-edit input:focus { outline: none; border-color: var(--amber); }
  .roster-edit .date-field { display: flex; align-items: center; gap: 6px; flex: 1 1 150px; font-size: 0.7rem; color: var(--muted); }
  .roster-edit input[type=date] { color-scheme: dark; }
  .btn.tiny { padding: 3px 9px; font-size: 0.7rem; flex-shrink: 0; }
  .btn.danger:hover:not(:disabled) { border-color: var(--red); color: var(--red); }

  @media (max-width: 760px) {
    :root { --gutter: 16px; }
    .hero { padding-top: 90px; min-height: 340px; }
    .hero h1 { font-size: 2.6rem; }
    .uploads { grid-template-columns: 1fr; }
    .metrics { grid-template-columns: 1fr; }
    .parsed-grid { grid-template-columns: 1fr; }
    .metric-val { font-size: 2.2rem; }
  }
</style>
</head>
<body>

<button class="menu-btn" id="menuBtn" aria-label="Configuration" aria-expanded="false" aria-controls="menu">☰</button>
<div class="menu" id="menu" hidden>
  <p class="menu-title">Configuration</p>
  <div id="menuBody"><p style="color:var(--dim);font-size:0.8rem">Loading…</p></div>
</div>

<div class="wrap">
  <header class="hero">
    <div class="pill">ACS Civils</div>
    <h1>SheetCheck</h1>
    <p>Catches errors in your daily allocation sheets before they're signed off.</p>
  </header>

  <div class="label">Upload PDFs</div>
  <div class="modes" role="radiogroup" aria-label="Upload mode">
    <label><input type="radio" name="mode" value="gang" checked> By gang</label>
    <label><input type="radio" name="mode" value="combined"> Combined PDF</label>
  </div>

  <div class="uploads" id="byGang">
    <div class="up" data-slot="gang1"><div class="up-title">Gang 1</div></div>
    <div class="up" data-slot="gang2"><div class="up-title">Gang 2</div></div>
    <div class="up" data-slot="gang3"><div class="up-title">Gang 3</div></div>
  </div>
  <div class="uploads single" id="combined" hidden>
    <div class="up" data-slot="combined" data-multi="1"></div>
  </div>

  <button class="run" id="run" disabled>Run Checks →</button>
  <div class="status" id="status" hidden></div>

  <div id="results"></div>
</div>

<script>
const CHECK_LABELS = {
  hours: "Hours total", hours_maths: "Hours maths", date: "Date / day", times: "Start / finish",
  prelim_operative: "Prelim operative", operatives: "Unknown operative", trade: "Trade mismatch",
  plant: "Unknown plant", required_plant: "Required plant", duplicates: "Duplicate",
  cross_gang_duplicate: "Cross-gang duplicate", formatting: "Formatting", parse: "Parse error",
};

// Builds a DOM element; children may be strings (as text) or nodes. No innerHTML with sheet data.
function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "open") n.open = !!v;
    else n.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null && c !== false) n.append(c);
  return n;
}
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

// ── Uploads ──────────────────────────────────────────────────────────
const slots = {};   // slot name -> File[]
const runBtn = document.getElementById("run");

function mode() { return document.querySelector('input[name="mode"]:checked').value; }

function activeFiles() {
  return mode() === "gang"
    ? ["gang1", "gang2", "gang3"].flatMap(s => slots[s] || [])
    : (slots.combined || []);
}

function refresh() { runBtn.disabled = activeFiles().length === 0; }

function setupSlot(card) {
  const slot = card.dataset.slot, multi = !!card.dataset.multi;
  slots[slot] = [];
  const input = el("input", { type: "file", accept: "application/pdf,.pdf", "aria-label": "Choose PDF" });
  if (multi) input.multiple = true;
  const drop = el("div", { class: "drop" },
    el("span", { class: "hint" }, multi ? "Drag and drop PDFs here, or click to browse" : "Drag and drop a PDF here, or click to browse"),
    el("span", { class: "sub" }, "PDF only"),
    input);
  const list = el("ul", { class: "files" });
  card.append(drop, list);

  const render = () => {
    list.replaceChildren(...slots[slot].map((f, i) => {
      const rm = el("button", { "aria-label": `Remove ${f.name}`, title: "Remove" }, "×");
      rm.onclick = () => { slots[slot].splice(i, 1); render(); };
      return el("li", {}, el("span", {}, f.name), rm);
    }));
    refresh();
  };
  const add = files => {
    const pdfs = [...files].filter(f => f.type === "application/pdf" || /\.pdf$/i.test(f.name));
    if (!pdfs.length) return;
    slots[slot] = multi ? slots[slot].concat(pdfs) : [pdfs[0]];
    render();
  };
  input.onchange = () => { add(input.files); input.value = ""; };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); add(e.dataTransfer.files); };
}
document.querySelectorAll(".up").forEach(setupSlot);

document.querySelectorAll('input[name="mode"]').forEach(r => r.onchange = () => {
  document.getElementById("byGang").hidden = mode() !== "gang";
  document.getElementById("combined").hidden = mode() !== "combined";
  refresh();
});

// ── Run ──────────────────────────────────────────────────────────────
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");

function setStatus(text, kind) {
  statusEl.hidden = !text;
  statusEl.className = "status" + (kind === "err" ? " err" : "");
  statusEl.replaceChildren(...(kind === "busy" ? [el("div", { class: "spin" })] : []), text || "");
}

async function postJSON(url, init) {
  const res = await fetch(url, init);
  if (!res.ok) {
    let msg = `${res.status} ${res.statusText}`;
    if (res.status === 413) msg = "File is too large to upload (max 4.5 MB per PDF).";
    try { const j = await res.json(); if (j.detail) msg = typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail); } catch {}
    throw new Error(msg);
  }
  return res.json();
}

let lastDays = null;   // parsed pages from the last run, so list edits can re-check without re-uploading

// Spelling corrections accepted via "Yes, I meant X", each for one sheet page only. Applied to the parsed pages before every
// check this session (the PDFs themselves still need fixing). Key: "labour|name" / "plant|name".
const corrections = new Map();
const pageKey = d => `${d._source_file}#${d.page}`;

function applyCorrections(days) {
  if (!corrections.size) return days;
  const fix = (d, section) => e => {
    const c = corrections.get(`${pageKey(d)}|${section}|${e.name.trim().toLowerCase()}`);
    return c ? { ...e, name: c.to } : e;
  };
  return days.map(d => ({ ...d, labour: (d.labour || []).map(fix(d, "labour")), plant: (d.plant || []).map(fix(d, "plant")) }));
}

async function runChecks(days) {
  return postJSON("/api/check", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ days: applyCorrections(days) }),
  });
}

async function recheck() {
  if (!lastDays) return;
  try { renderResults(await runChecks(lastDays), false); }
  catch (e) { setStatus("Couldn't refresh results: " + e.message, "err"); }
}

runBtn.onclick = async () => {
  const files = activeFiles();
  runBtn.disabled = true;
  resultsEl.replaceChildren();
  try {
    setStatus("Reading PDFs…", "busy");
    const parsed = await Promise.all(files.map(f => {
      const fd = new FormData();
      fd.append("file", f, f.name);
      return postJSON("/api/parse", { method: "POST", body: fd })
        .catch(e => { throw new Error(`${f.name}: ${e.message}`); });
    }));
    setStatus("Running checks…", "busy");
    lastDays = parsed.flatMap(p => p.days);
    const result = await runChecks(lastDays);
    setStatus("");
    renderResults(result, true);
  } catch (e) {
    setStatus("Something went wrong: " + e.message, "err");
  } finally {
    refresh();
  }
};

// ── Editing the known lists ──────────────────────────────────────────
function toast(msg) {
  const t = el("div", { class: "toast", role: "status" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}

// Sends one list change. Returns the server message.
async function updateConfig(body) {
  const data = await postJSON("/api/config/update", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  return data.message;
}

// After a list change: re-run checks on the same pages so the results reflect it.
async function afterChange(message) {
  toast(message);
  loadMenu();
  await recheck();
}

// Wires a button to an update call, showing errors inline in `box`.
function doUpdate(box, buttons, body) {
  return async () => {
    box.querySelector(".act-err")?.remove();
    buttons.forEach(b => b.disabled = true);
    try {
      const msg = await updateConfig(body());
      if (msg) await afterChange(msg);
    } catch (e) {
      box.append(el("div", { class: "act-err" }, e.message));
    } finally {
      buttons.forEach(b => b.disabled = false);
    }
  };
}

function addForm(box, a) {
  const name = el("input", { type: "text", value: a.name, "aria-label": "Name", size: "22" });
  const extra = a.type === "add_operative"
    ? el("input", { type: "text", value: a.trade || "", placeholder: "Trade", "aria-label": "Trade", size: "14" })
    : el("label", { class: "chk" }, el("input", { type: "checkbox" }), "Vehicle / machine (check for cross-gang duplicates)");
  const save = el("button", { class: "btn primary" }, "Save");
  const cancel = el("button", { class: "btn" }, "Cancel");
  cancel.onclick = () => box.replaceChildren(...actionButtons(box, a));
  save.onclick = doUpdate(box, [save, cancel], () => a.type === "add_operative"
    ? { action: "add_operative", name: name.value, trade: extra.value }
    : { action: "add_plant", name: name.value, vehicle: extra.querySelector("input").checked });
  box.replaceChildren(name, extra, save, cancel);
  name.focus();
}

function offhireButtons(box, name, onNo) {
  const yes = el("button", { class: "btn primary" }, "Yes, it's gone (offhired)");
  const no = el("button", { class: "btn" }, "No, still on hire");
  yes.onclick = doUpdate(box, [yes, no], () => ({ action: "offhire", name }));
  no.onclick = onNo;
  return [yes, no];
}

function actionButtons(box, a) {
  if (a.type === "offhire") {
    return offhireButtons(box, a.name, () =>
      box.replaceChildren(el("div", { class: "done-note muted" }, "Still on hire, so it should be on this sheet. Add it back before sign-off.")));
  }
  const b = el("button", { class: "btn" }, a.type === "add_operative" ? "Add to labour roster" : "Add to known plant");
  b.onclick = () => addForm(box, a);
  if (!a.suggestion || !a.sheet) return [b];

  const yes = el("button", { class: "btn primary" }, `Yes, I meant ${a.suggestion}`);
  yes.onclick = async () => {
    const section = a.type === "add_operative" ? "labour" : "plant";
    const where = `${a.sheet.gang ? `Gang ${a.sheet.gang} · ` : ""}${a.sheet.day || `Page ${a.sheet.page}`} ${a.sheet.date_str || ""}`.trim();
    corrections.set(`${pageKey(a.sheet)}|${section}|${a.name.toLowerCase()}`, { section, from: a.name, to: a.suggestion, where });
    yes.disabled = true;
    toast(`Treating '${a.name}' as '${a.suggestion}'. Fix it on the sheet before sign-off.`);
    await recheck();
  };
  return [yes, b];
}

function correctionsNode() {
  const rows = [...corrections.entries()].map(([key, c]) => {
    const undo = el("button", { class: "btn" }, "Undo");
    undo.onclick = async () => { corrections.delete(key); await recheck(); };
    return el("div", { class: "unseen-row" },
      el("div", { class: "actions", style: "margin-top:0;justify-content:space-between" },
        el("span", { class: "q" }, `'${c.from}' → `, el("b", {}, c.to), el("span", { style: "color:var(--muted)" }, `  ·  ${c.where}`)), undo));
  });
  return el("div", { class: "unseen" },
    el("p", { class: "unseen-note" }, "These spellings are being treated as corrected for this check. Fix them on the sheets before sign-off."),
    rows);
}

// ── Results ──────────────────────────────────────────────────────────
// `day` is the sheet page the issue belongs to, so a spelling fix only applies to that page.
function issueNode(i, day) {
  const label = CHECK_LABELS[i.check] || i.check.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
  const icon = i.severity === "error" ? "❌" : "⚠️";
  const node = el("div", { class: `issue ${i.severity}` },
    el("div", { class: "issue-label" }, `${icon}  ${label}`), i.message);
  if (i.action) {
    const box = el("div", { class: "actions" });
    box.append(...actionButtons(box, { ...i.action, sheet: day }));
    node.append(box);
  }
  return node;
}

function unseenNode(names) {
  const rows = names.map(name => {
    const box = el("div", { class: "actions" });
    box.append(...offhireButtons(box, name, () =>
      box.replaceChildren(el("div", { class: "done-note muted" }, "OK, keeping it on the list."))));
    return el("div", { class: "unseen-row" },
      el("div", { class: "q" }, el("b", {}, name), " isn't on any sheet. Has this been offhired? Is this gone?"),
      box);
  });
  return el("div", { class: "unseen" },
    el("p", { class: "unseen-note" }, "These are on the known plant list but don't appear on any sheet in this upload. Required plant (hand tools, saws, chains) isn't included."),
    rows);
}

function badgeNode(issues) {
  const e = issues.filter(i => i.severity === "error").length;
  const w = issues.filter(i => i.severity === "warning").length;
  if (!issues.length) return el("span", { class: "badge" }, el("span", { class: "ok" }, "✅ Clear"));
  return el("span", { class: "badge" },
    e ? el("span", { class: "e" }, `❌ ${plural(e, "error")}`) : null,
    e && w ? "  " : null,
    w ? el("span", { class: "w" }, `⚠️ ${plural(w, "warning")}`) : null);
}

function dayNode({ day, issues }) {
  const title = `${day.day || `Page ${day.page ?? "?"}`}  ${day.date_str || ""}`.trim();
  const ordered = [...issues.filter(i => i.severity === "error"), ...issues.filter(i => i.severity === "warning")];
  const body = el("div", { class: "day-body" },
    ordered.length ? ordered.map(i => issueNode(i, day)) : el("p", { class: "clear" }, "No issues found."));

  const labour = day.labour || [], plant = day.plant || [];
  if (labour.length || plant.length) {
    body.append(el("details", { class: "parsed" },
      el("summary", {}, "View parsed data"),
      el("div", { class: "parsed-grid" },
        el("div", {}, labour.length ? [el("h4", {}, "Labour"),
          el("ul", {}, labour.map(e => el("li", {}, `${e.name} | ${e.trade || "—"} | ${e.stated_total}h`)))] : null),
        el("div", {}, plant.length ? [el("h4", {}, "Plant"),
          el("ul", {}, plant.map(e => el("li", {}, `${e.name} | ${e.stated_total}h`)))] : null))));
  }

  return el("details", { class: "day", open: issues.length > 0 },
    el("summary", {}, el("span", { class: "sum-left" }, title), badgeNode(issues)),
    body);
}

function renderResults(r, scroll) {
  const s = r.summary;
  const out = [
    el("hr", { class: "rule" }),
    el("div", { class: "label" }, "Summary"),
    el("div", { class: "metrics" },
      el("div", { class: "metric" }, el("div", { class: `metric-val ${s.errors ? "c-red" : "c-green"}` }, String(s.errors)), el("div", { class: "metric-lbl" }, "Errors")),
      el("div", { class: "metric" }, el("div", { class: `metric-val ${s.warnings ? "c-amber" : "c-green"}` }, String(s.warnings)), el("div", { class: "metric-lbl" }, "Warnings")),
      el("div", { class: "metric" }, el("div", { class: "metric-val c-white" }, String(s.days)), el("div", { class: "metric-lbl" }, `${plural(s.gangs, "gang")} · ${plural(s.days, "day")} checked`))),
  ];
  if (!s.errors && !s.warnings) out.push(el("div", { class: "success" }, "All checks passed across every sheet."));

  if (corrections.size) {
    out.push(el("div", { class: "gang", style: "margin-top:0" },
      el("span", { class: "gang-name" }, "Spelling fixes to make"),
      el("span", { class: "gang-file" }, plural(corrections.size, "item"))));
    out.push(correctionsNode());
  }

  for (const g of r.gangs) {
    out.push(el("div", { class: "gang" },
      el("span", { class: "gang-name" }, g.label),
      el("span", { class: "gang-file" }, g.files.join(", "))));
    out.push(...g.days.map(dayNode));
  }

  if (r.cross_gang) {
    out.push(el("div", { class: "gang" }, el("span", { class: "gang-name" }, "Cross-Gang Checks")));
    out.push(...(r.cross_gang.length ? r.cross_gang.map(i => issueNode(i)) : [el("div", { class: "success" }, "No cross-gang duplicates found.")]));
  }

  if (r.unseen_plant && r.unseen_plant.length) {
    out.push(el("div", { class: "gang" },
      el("span", { class: "gang-name" }, "Plant not on any sheet"),
      el("span", { class: "gang-file" }, plural(r.unseen_plant.length, "item"))));
    out.push(unseenNode(r.unseen_plant));
  }

  // Keep which day cards are open across a refresh after a list edit
  const openState = scroll ? null : [...resultsEl.querySelectorAll("details")].map(d => d.open);
  resultsEl.replaceChildren(...out);
  if (openState) resultsEl.querySelectorAll("details").forEach((d, i) => { if (i < openState.length) d.open = openState[i]; });
  if (scroll) resultsEl.firstChild.scrollIntoView({ behavior: "smooth", block: "start" });
}

// ── Config menu ──────────────────────────────────────────────────────
const menuBtn = document.getElementById("menuBtn"), menu = document.getElementById("menu");
menuBtn.onclick = e => {
  e.stopPropagation();
  menu.hidden = !menu.hidden;
  menuBtn.setAttribute("aria-expanded", String(!menu.hidden));
};
document.addEventListener("click", e => {
  // Clicks on a toast, or on a menu button that just swapped itself out, shouldn't close the menu mid-edit
  if (!menu.hidden && e.target.isConnected && !menu.contains(e.target) && !e.target.closest(".toast")) { menu.hidden = true; menuBtn.setAttribute("aria-expanded", "false"); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { menu.hidden = true; menuBtn.setAttribute("aria-expanded", "false"); } });

// One labour roster row: shows the operative, or an inline form to rename / change trade / remove them.
function rosterRow(o) {
  const li = el("li", { class: "roster-row" });
  const show = () => {
    const edit = el("button", { class: "btn tiny" }, "Edit");
    edit.onclick = editForm;
    li.replaceChildren(el("span", {}, el("b", {}, o.name), ` — ${o.trade}`), edit);
  };
  const editForm = () => {
    const name = el("input", { type: "text", value: o.name, "aria-label": "Name" });
    const trade = el("input", { type: "text", value: o.trade, placeholder: "Trade", "aria-label": "Trade" });
    const save = el("button", { class: "btn primary" }, "Save");
    const cancel = el("button", { class: "btn" }, "Cancel");
    const remove = el("button", { class: "btn danger" }, "Remove");
    const box = el("div", { class: "actions roster-edit" }, name, trade, save, cancel, remove);
    cancel.onclick = show;
    save.onclick = doUpdate(box, [save, cancel, remove], () =>
      ({ action: "edit_operative", original_name: o.name, name: name.value, trade: trade.value }));
    const doRemove = doUpdate(box, [save, cancel, remove], () => ({ action: "remove_operative", name: o.name }));
    remove.onclick = () => { if (confirm(`Remove ${o.name} from the labour roster?`)) doRemove(); };
    box.onkeydown = e => { if (e.key === "Enter" && e.target.tagName === "INPUT") save.click(); };
    li.replaceChildren(box);
    name.focus();
  };
  show();
  return li;
}

function addOperativeRow() {
  const li = el("li", { class: "roster-row" });
  const show = () => {
    const add = el("button", { class: "btn tiny" }, "+ Add operative");
    add.onclick = form;
    li.replaceChildren(add);
  };
  const form = () => {
    const name = el("input", { type: "text", placeholder: "Name", "aria-label": "Name" });
    const trade = el("input", { type: "text", placeholder: "Trade", "aria-label": "Trade" });
    const save = el("button", { class: "btn primary" }, "Add");
    const cancel = el("button", { class: "btn" }, "Cancel");
    const box = el("div", { class: "actions roster-edit" }, name, trade, save, cancel);
    cancel.onclick = show;
    save.onclick = doUpdate(box, [save, cancel], () => ({ action: "add_operative", name: name.value, trade: trade.value }));
    box.onkeydown = e => { if (e.key === "Enter" && e.target.tagName === "INPUT") save.click(); };
    li.replaceChildren(box);
    name.focus();
  };
  show();
  return li;
}

// One prelim operative row (site management on every sheet). Optional from/until dates limit
// which sheets they must appear on, so a replacement doesn't flag older or newer sheets.
const ukDate = iso => iso ? iso.split("-").reverse().join("/") : "";
function prelimForm(li, p, onCancel) {
  const name = el("input", { type: "text", value: p ? p.name : "", placeholder: "Name", "aria-label": "Name" });
  const trade = el("input", { type: "text", value: p ? p.trade : "", placeholder: "Trade", "aria-label": "Trade" });
  const from = el("input", { type: "date", value: p ? p.from : "", "aria-label": "On sheets from (optional)", title: "On sheets from (optional)" });
  const until = el("input", { type: "date", value: p ? p.until : "", "aria-label": "On sheets until (optional)", title: "On sheets until (optional)" });
  const save = el("button", { class: "btn primary" }, p ? "Save" : "Add");
  const cancel = el("button", { class: "btn" }, "Cancel");
  const buttons = [save, cancel];
  const box = el("div", { class: "actions roster-edit" }, name, trade,
    el("label", { class: "date-field" }, "From", from), el("label", { class: "date-field" }, "Until", until), save, cancel);
  cancel.onclick = onCancel;
  save.onclick = doUpdate(box, buttons, () => p
    ? { action: "edit_prelim", original_name: p.name, name: name.value, trade: trade.value, from: from.value, until: until.value }
    : { action: "add_prelim", name: name.value, trade: trade.value, from: from.value, until: until.value });
  if (p) {
    const remove = el("button", { class: "btn danger" }, "Remove");
    buttons.push(remove);
    box.append(remove);
    const doRemove = doUpdate(box, buttons, () => ({ action: "remove_prelim", name: p.name }));
    remove.onclick = () => { if (confirm(`Remove ${p.name} from the prelim operatives?`)) doRemove(); };
  }
  box.onkeydown = e => { if (e.key === "Enter" && e.target.tagName === "INPUT") save.click(); };
  li.replaceChildren(box);
  name.focus();
}

function prelimRow(p) {
  const li = el("li", { class: "roster-row" });
  const show = () => {
    const edit = el("button", { class: "btn tiny" }, "Edit");
    edit.onclick = () => prelimForm(li, p, show);
    const range = [p.from && `from ${ukDate(p.from)}`, p.until && `until ${ukDate(p.until)}`].filter(Boolean).join(" ");
    li.replaceChildren(el("span", {}, el("b", {}, p.name), p.trade ? ` — ${p.trade}` : "",
      range ? el("span", { class: "n" }, `  ·  ${range}`) : ""), edit);
  };
  show();
  return li;
}

function addPrelimRow() {
  const li = el("li", { class: "roster-row" });
  const show = () => {
    const add = el("button", { class: "btn tiny" }, "+ Add prelim operative");
    add.onclick = () => prelimForm(li, null, show);
    li.replaceChildren(add);
  };
  show();
  return li;
}

const loadMenu = () => fetch("/api/config").then(r => r.json()).then(cfg => {
  const body = document.getElementById("menuBody");
  const wasOpen = new Set([...body.querySelectorAll("details[open]")].map(d => d.dataset.key));
  const section = (title, items, rows) => el("details", { "data-key": title, open: wasOpen.has(title) },
    el("summary", {}, title, el("span", { class: "n" }, `  ·  ${items.length}`)),
    el("ul", rows ? { class: "roster" } : {}, rows || items.map(i => el("li", {}, i))));
  const ops = cfg.known_operatives || [];
  const prelims = Object.entries(cfg.prelim_operatives || {}).map(([name, r]) =>
    ({ name, trade: r.trade || "", from: r.from || "", until: r.until || "" }));
  body.replaceChildren(
    section("Prelim Operatives", prelims, [...prelims.map(prelimRow), addPrelimRow()]),
    section("Labour Roster", ops, [...ops.map(rosterRow), addOperativeRow()]),
    section("Prelim Plant", cfg.prelim_plant || []),
    section("Required Plant", (cfg.required_plant_groups || []).map(g => [el("b", {}, g.label), ` — ${g.variants.join(" / ")}`])),
    section("Known Plant", cfg.known_plant || []));
}).catch(() => {
  document.getElementById("menuBody").replaceChildren(el("p", { style: "color:#fca5a5;font-size:0.8rem" }, "Could not load configuration."));
});
loadMenu();
</script>
</body>
</html>
